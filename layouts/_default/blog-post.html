{{ define "window_title"}}
    {{ .Params.window_title }}
{{ end }}

{{ define "main" }}
    <div class="container">
        <div class="single-large-column">
            <h1 class="blog-title">{{ .Title }}</h1>
            <div class="blog-date">{{ .Date.Format "2 January 2006" }}</div>
            <hr class="green">
            {{ .Content }}
            {{ partial "taxonomy.html" . }}
        </div>
        {{ partial "prevnext.html" . }}
    </div>
    {{ partial "footer-parabola.html" . }}
{{ end }}
